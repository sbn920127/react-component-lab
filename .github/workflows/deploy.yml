name: Deploy Storybook to GitHub Pages

on:
  # 當程式碼 push 到 main 分支時觸發
  push:
    branches: ["main"]

  # 允許你在 GitHub 介面上手動觸發 (方便測試)
  workflow_dispatch:

# 設定權限 (GitHub Pages 需要寫入權限)
permissions:
  contents: read
  pages: write
  id-token: write

# 只允許同時執行一個部署任務
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 打包 Storybook
        # 使用 filter 只打包 docs 專案
        run: pnpm --filter docs build

      - name: 上傳打包產物
        uses: actions/upload-pages-artifact@v3
        with:
          # 注意：這是 Storybook 預設的輸出目錄，位於 apps/docs 下
          path: 'apps/docs/storybook-static'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
